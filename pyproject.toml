[project]
name = "handshake-evidence-verifier"
version = "0.1.0"
description = "Hermetic offline verifier for Handshake evidence packs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Handshake AI" }]
# Stdlib-only by design — see ADR-0014.
dependencies = []

[project.scripts]
handshake-verify = "verifier.cli:main"

[tool.setuptools]
packages = ["verifier"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
